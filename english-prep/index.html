<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Prep</title>
<meta name="description" content="Four weeks of TOEFL and IELTS prep: foundation lessons, a daily plan, 395 exam words with Greek meanings, timed writing, reading and speaking practice with corrections, and progress tracking.">
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1422" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='20' width='56' height='28' rx='7' fill='%23FFE45C' transform='rotate(-7 32 34)'/%3E%3Cpath d='M18 34l9 9 20-22' fill='none' stroke='%231B2333' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
:root{
  --bg:#F6F3EE; --sheet:#FFFFFF; --ink:#1B2333; --ink2:#465166; --muted:#636E83; --rule:#E2E5EB; --rule2:#C3CCDA;
  --accent:#2142C8; --accent-ink:#FFFFFF; --accent-soft:#E8EDFC;
  --hi:#FFE45C; --hi-ink:#1B2333;
  --red:#C02B36; --good:#12753C; --warn:#B45309;
  --s-reading:#2a78d6; --s-listening:#eb6834; --s-writing:#1baf7a; --s-vocab:#eda100; --s-speaking:#e87ba4; --s-mock:#008300;
  --chart-surface:#FFFFFF; --grid:#E7EAF0; --axis:#C3CCDA;
  --glow1:rgba(255,168,120,.30); --glow2:rgba(130,140,255,.24); --glow3:rgba(80,196,160,.20); --dots:rgba(27,35,51,.07);
  --hero1:#FFF1E2; --hero2:#FCE5EF; --hero3:#E2E8FF; --hero-line:rgba(27,35,51,.07);
  --cell:rgba(27,35,51,.12); --ticket:rgba(255,255,255,.7);
  --sky-bld:rgba(27,35,51,.10); --sky-win:rgba(255,255,255,.75); --sun:rgba(255,166,77,.45);
  --shadow:0 1px 2px rgba(20,28,45,.05),0 8px 26px rgba(20,28,45,.07);
  --bar:rgba(255,253,249,.93);
  --font-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1422; --sheet:#161E31; --ink:#E8ECF4; --ink2:#B6BFD1; --muted:#8C97AD; --rule:#253049; --rule2:#36435F;
    --accent:#8AA2FF; --accent-ink:#0E1422; --accent-soft:#1E2944;
    --hi:#F0D14A; --hi-ink:#151B2B;
    --red:#FF7A7A; --good:#4CD38A; --warn:#F5B94A;
    --s-reading:#3987e5; --s-listening:#d95926; --s-writing:#199e70; --s-vocab:#c98500; --s-speaking:#d55181; --s-mock:#008300;
    --chart-surface:#161E31; --grid:#222C44; --axis:#36435F;
    --glow1:rgba(110,120,255,.20); --glow2:rgba(214,90,160,.12); --glow3:rgba(40,170,150,.13); --dots:rgba(255,255,255,.045);
    --hero1:#1C2546; --hero2:#2A2450; --hero3:#13304A; --hero-line:rgba(255,255,255,.07);
    --cell:rgba(255,255,255,.14); --ticket:rgba(14,20,34,.45);
    --sky-bld:rgba(255,255,255,.075); --sky-win:rgba(255,214,102,.55); --sun:rgba(255,236,170,.28);
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --bar:rgba(22,30,49,.94);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* soft coloured light and a faint dot grid behind everything; Settings can switch it off */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(44rem 32rem at -6% -8%,var(--glow1),transparent 70%),radial-gradient(40rem 30rem at 106% 4%,var(--glow2),transparent 70%),
    radial-gradient(48rem 34rem at 50% 108%,var(--glow3),transparent 70%),radial-gradient(var(--dots) 1px,transparent 1.5px) 0 0/22px 22px}
html[data-bg="plain"] body::before{display:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
p{margin:0 0 10px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .mark{width:24px;height:24px}
h1.day{font-family:var(--font-display);font-weight:760;font-size:clamp(36px,10vw,54px);line-height:1;letter-spacing:-.03em;margin:6px 0 8px}
.sub{margin:0;color:var(--ink2);font-size:17px}
.hero{position:relative;overflow:hidden;margin-top:12px;padding:18px 20px 16px;border-radius:22px;border:1px solid var(--hero-line);
  background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 52%,var(--hero3) 100%);box-shadow:var(--shadow)}
.hero>*{position:relative;z-index:1}
.hero>.hero-top{position:static}
.hero-top>*:not(.sky){position:relative;z-index:1}
.greet{margin:0;font-weight:700;color:var(--ink2);font-size:16px}
.sky{position:absolute;right:-2px;bottom:-1px;width:min(300px,64%);height:auto;z-index:0;pointer-events:none}
@media (min-width:640px){
  .hero>.hero-top{position:relative}
  .hero-top .sky{right:-6px;bottom:-4px;height:calc(100% + 24px);width:auto;max-width:56%}
}
.sky .bld{fill:var(--sky-bld)}
.sky .win{fill:var(--sky-win)}
.sky .sun{fill:var(--sun)}
.hero .cell{background:var(--cell)}
.hero .cell.part{background:linear-gradient(to top,var(--ink2) 0 45%,var(--cell) 45%)}
.hero .cell.full{background:var(--ink)}
.hero .cell.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule2)}
.hero .cell.today{outline-color:var(--ink)}
.hero .cell.today:not(.full):not(.part){background:var(--hi)}
.hero .ticket{background:var(--ticket)}
.top.compact .hero{padding:12px 18px;border-radius:18px}
.top.compact .hero-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.top.compact h1.day{font-size:26px;margin:0}
.top.compact .sub{font-size:15px}
@media (max-width:639px){.top.compact .sky{display:none}}
.strip{display:grid;gap:clamp(6px,2.2vw,14px);margin:18px 0 12px;max-width:640px}
.strip .wk{display:grid;gap:clamp(2px,.8vw,4px)}
.cell{display:block;aspect-ratio:5/8;width:100%;min-width:0;padding:0;border:0;border-radius:3px;background:var(--rule);cursor:pointer}
.cell.part{background:linear-gradient(to top,var(--ink2) 0 45%,var(--rule) 45%)}
.cell.full{background:var(--ink)}
.cell.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule2)}
.cell.last{border-radius:999px}
.cell.today{outline:3px solid var(--hi);outline-offset:1px}
.cell.today:not(.full):not(.part){background:var(--hi)}
.cell:hover{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.exams{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.ticket{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1.5px solid var(--rule2);border-radius:8px;font-size:14px;color:var(--ink2);background:transparent;line-height:1.3}
.ticket b{color:var(--ink)}
button.ticket{border-style:dashed;cursor:pointer}
button.ticket:hover{border-color:var(--ink2)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs-inner{display:flex;padding-top:4px;padding-bottom:4px}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border:0;background:none;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;border-radius:10px;position:relative}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.tab span{position:relative;z-index:1}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:13px;left:50%;width:36px;height:15px;transform:translateX(-50%) rotate(-5deg);background:var(--hi);border-radius:3px 8px 4px 9px;z-index:0}
@media (prefers-color-scheme: dark){.tab[aria-current="page"] svg{color:var(--hi-ink)}}
.badge{position:absolute!important;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center;z-index:2!important}
#main{padding-bottom:calc(120px + env(safe-area-inset-bottom));min-height:60vh}
main:focus{outline:none}
@media (min-width:760px){
  nav.tabs{position:sticky;top:0;bottom:auto;margin-top:10px;border-top:0;border-bottom:1px solid var(--rule);padding-bottom:0}
  .tabs-inner{gap:2px;padding-top:6px;padding-bottom:6px}
  .tab{flex:none;flex-direction:row;gap:8px;font-size:15px;padding:9px 12px}
  .tab svg{width:20px;height:20px}
  .tab[aria-current="page"]::before{top:auto;bottom:7px;left:8px;right:8px;width:auto;height:11px;transform:rotate(-1.5deg)}
  @media (prefers-color-scheme: dark){.tab[aria-current="page"] svg{color:inherit}}
  .badge{position:static!important;margin-left:2px}
  #main{padding-bottom:72px}
}

/* type and layout */
h2{font-family:var(--font-display);font-weight:720;font-size:27px;line-height:1.12;letter-spacing:-.02em;margin:26px 0 8px}
h3.sec{font-family:var(--font-display);font-weight:680;font-size:19px;line-height:1.2;letter-spacing:-.01em;margin:30px 0 10px}
h4{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:2px 16px;box-shadow:var(--shadow)}
.sheet.pad{padding:16px}
.dateline{margin:24px 0 0;color:var(--ink2);font-weight:700}
.weekline{margin:0;color:var(--muted)}
.daytitle{margin-top:4px}
.hl{background:var(--hi);color:var(--hi-ink);border-radius:3px 7px 4px 8px;padding:0 .35em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.crumbs{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;font-size:15px}
.banner{margin-top:12px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--red);font-size:14px;background:var(--sheet)}

/* tasks */
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:13px 0;border-top:1px solid var(--rule)}
.task:first-child{border-top:0}
.task label{cursor:pointer;min-width:0}
.t-text{display:block}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:2px;font-size:14px;color:var(--muted)}
.t-meta>span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.task.done .t-text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--rule2)}
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--ink2);border-radius:7px;background:var(--sheet);display:grid;place-content:center;cursor:pointer;flex:none;transition:background-color .15s}
.check::after{content:"";width:12px;height:7px;border:solid var(--sheet);border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s}
.check:checked{background:var(--ink);border-color:var(--ink)}
.check:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.overdue{margin-top:14px}
.overdue .sheet{margin-top:10px}
.overdue-toggle{display:inline-flex;align-items:center;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--rule2);background:var(--sheet);color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--red)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.iconbtn:hover{background:var(--accent-soft);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 0}
.actions.end{justify-content:flex-end}
.actions.center{justify-content:center}

/* forms */
.fld{display:block;font-weight:700;font-size:14px;color:var(--ink2);margin:12px 0 0}
.inp{display:block;width:100%;margin-top:4px;font-weight:400;padding:10px 12px;border:1.5px solid var(--rule2);border-radius:10px;background:var(--sheet);font-size:16px;color:var(--ink);min-height:44px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 150px;min-width:0}
.row.four>*{flex:1 1 110px}
.chips{display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0;margin:10px 0 0;min-width:0}
.chips legend{font-weight:700;font-size:14px;color:var(--ink2);padding:0;margin-bottom:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip>span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--rule2);border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;min-height:36px}
.chip input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.checkrow{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:700;cursor:pointer}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--accent-soft);gap:2px;margin:6px 0 4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:700;color:var(--ink2);cursor:pointer;min-height:38px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--rule2)}

/* today stats */
.meter{height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--s-writing));border-radius:0 5px 5px 0}
.todaystats{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:10px;color:var(--ink2);font-size:15px}
.todaystats b{color:var(--ink)}
.bigline{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em}

/* plan */
details.part{border-top:1px solid var(--rule)}
details.part:last-of-type{border-bottom:1px solid var(--rule)}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:16px 0}
details.part summary::-webkit-details-marker{display:none}
.wk-name{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.wk-dates{grid-column:1;color:var(--muted);font-size:14px}
.wk-count{grid-column:2;grid-row:1/span 2;align-self:center;font-weight:700;color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:8px}
.wk-count svg{transition:transform .2s}
details.part[open] .wk-count svg{transform:rotate(180deg)}
.wk-goal{color:var(--ink2);margin:0 0 6px}
.pday{padding:12px 0 6px}
.pday-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.pday-date{font-weight:700;color:var(--muted);font-size:14px;min-width:84px}
.pday-title{font-weight:700}
.pday .tasks{margin-left:0}
.pday.flash .pday-title{background:var(--hi);color:var(--hi-ink);border-radius:3px 7px 4px 8px;padding:0 .3em}

/* practice */
.plist .pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--rule)}
.plist .pitem:first-child{border-top:0}
.pitem h4{font-size:17px;font-weight:700}
.pitem p{margin:2px 0 0;color:var(--muted);font-size:14px}
.prompt{padding:16px 18px;font-size:17px;line-height:1.6}
.prompt p:last-child{margin-bottom:0}
.prompt ul{margin:4px 0 10px;padding-left:22px}
.prompt .note{font-size:13px;color:var(--muted)}
.post{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--rule)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--ink);font-size:14px}
.post .who{font-weight:700;font-size:14px;color:var(--ink2);margin-bottom:2px}
.post p{margin:0}
.timerbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.timer{font-family:var(--font-display);font-weight:720;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.timer small{display:block;font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0;margin-top:4px}
.timer.over{color:var(--red)}
.paper{display:block;width:100%;min-height:min(52vh,460px);resize:vertical;border:1.5px solid var(--rule2);border-radius:12px;padding:12px 16px;font:400 17px/28px var(--font-ui);color:var(--ink);background-color:var(--sheet);background-image:linear-gradient(to bottom,transparent 27px,var(--rule) 27px);background-size:100% 28px;background-position:0 12px;background-attachment:local}
.paper:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wc{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px;color:var(--ink2);font-weight:700;flex-wrap:wrap}
.wc-track{flex:1 1 160px;height:8px;border-radius:4px;background:var(--rule);overflow:hidden;max-width:320px}
.wc-fill{height:100%;width:0;background:var(--accent);border-radius:0 4px 4px 0}
.wc.met .wc-fill{background:var(--good)}
.essay-read{white-space:pre-wrap;line-height:1.65;padding:16px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);margin-top:14px;overflow-wrap:anywhere}
.histrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.histrow:first-child{border-top:0}
.histrow p{margin:0}
.bubble{background:var(--accent-soft);border-radius:14px 14px 14px 4px;padding:12px 14px;display:inline-block;max-width:100%;font-size:17px}
.answer{min-height:58px;border-bottom:2px solid var(--ink2);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px}
.answer .ph{color:var(--muted);font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chunk{padding:9px 13px;border-radius:9px;border:1.5px solid var(--rule2);background:var(--sheet);font-size:16px;cursor:pointer;min-height:42px}
.chunk:hover{border-color:var(--ink2)}
.answer .chunk{border-color:var(--ink2);background:var(--bg)}
.feedback{font-weight:700;margin:12px 0 0;display:flex;gap:8px;align-items:flex-start}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--red)}
.feedback .fix{color:var(--ink);font-weight:400}
.feedback .ans{color:var(--ink);font-weight:700;font-size:1.08em}
.stage{padding:20px}
.slabel{font-size:14px;color:var(--muted);font-weight:700}
.phase{font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px;margin:4px 0 0}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.count{font-family:var(--font-display);font-size:clamp(60px,17vw,92px);font-weight:760;line-height:1;letter-spacing:-.03em;margin:10px 0 10px;font-variant-numeric:tabular-nums}
.countbar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;max-width:420px}
.countbar i{display:block;height:100%;background:var(--ink);width:100%}
.question{font-size:clamp(19px,4.8vw,24px);line-height:1.4;font-weight:700;margin:14px 0}
.ctx{color:var(--ink2);font-size:15px}
.cuecard{border:1.5px dashed var(--ink2);border-radius:10px;padding:14px 16px;margin:14px 0;font-size:17px}
.cuecard p{margin:0 0 6px}
.cuecard ul{margin:4px 0 8px;padding-left:22px}
.recs{display:grid;gap:12px}
.recrow{padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet)}
.recrow p{margin:0 0 8px;font-size:14px;color:var(--ink2)}
.recrow audio{width:100%;height:40px;display:block}
.recrow .linkbtn{display:inline-block;margin-top:8px;font-size:14px}

/* words */
.flash{padding:30px 20px 22px;text-align:center}
.flash .term{font-family:var(--font-display);font-weight:720;font-size:clamp(30px,8.5vw,46px);line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.flash .meaning{font-size:21px;margin-top:6px;overflow-wrap:anywhere}
.flash .ex{color:var(--ink2);font-style:italic;margin:10px auto 0;max-width:46ch}
.flash hr{border:0;border-top:1px dashed var(--rule2);margin:20px auto;max-width:280px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.wrow:first-child{border-top:0}
.wrow .w-term{font-weight:700;overflow-wrap:anywhere}
.wrow .w-mean{color:var(--ink2);font-size:15px;overflow-wrap:anywhere}
.wrow .w-ex{color:var(--muted);font-size:14px;font-style:italic;overflow-wrap:anywhere}
.boxes{display:inline-flex;gap:2px;align-items:center}
.boxes i{width:7px;height:7px;border-radius:2px;border:1.5px solid var(--rule2)}
.boxes i.on{background:var(--ink);border-color:var(--ink)}
.duebox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* progress */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 0}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:12px 14px;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);box-shadow:var(--shadow)}
.stat .v{font-family:var(--font-display);font-size:28px;font-weight:720;line-height:1.1;letter-spacing:-.01em}
.stat .v small{font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:0}
.stat .l{font-size:14px;color:var(--muted)}
.chart{position:relative;min-height:40px}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font-ui);font-size:12px;fill:var(--muted)}
.chart text.ink{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .goal{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:focus{outline:none}
.chart .hit:focus-visible{stroke:var(--accent);stroke-width:2}
.chart .hover{fill:var(--grid)}
.chart .cross{stroke:var(--ink2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.legend li{display:inline-flex;align-items:center;gap:6px}
.key{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.key.dash{width:18px;height:0;border-top:2px dashed var(--ink2);border-radius:0;background:none}
.key.lk{width:18px;height:0;border-top:2px solid var(--c);border-radius:0;background:none}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--sheet);border:1px solid var(--rule2);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 8px 28px rgba(15,23,42,.14);min-width:150px;color:var(--ink2)}
.tip .tt{font-weight:700;color:var(--ink);margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;line-height:1.5}
.tip .tr b{color:var(--ink);min-width:44px;font-variant-numeric:tabular-nums}
.tip .lk{width:12px;height:0;border-top:2px solid var(--c);flex:none}
details.tableview{margin-top:12px}
details.tableview summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px}
.tablewrap{overflow-x:auto;margin-top:8px;position:relative}
table.data{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.data th{color:var(--ink2);font-weight:700}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td.wrap{white-space:normal;text-align:left;min-width:120px}
.hbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;font-size:14px}
.hbars .lab{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.hbars .track{border-left:1.5px solid var(--axis);height:16px;display:flex;align-items:center}
.hbars .bar{height:12px;border-radius:0 4px 4px 0;background:var(--c);min-width:2px}
.hbars .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 12px;align-items:center;font-size:14px}
.sbars .lab{color:var(--ink2)}
.sbars .track{position:relative;height:16px;border-left:1.5px solid var(--axis)}
.sbars .bar{position:absolute;left:0;top:2px;height:12px;border-radius:0 4px 4px 0;background:var(--ink2)}
.sbars .tgt{position:absolute;top:-5px;bottom:-5px;border-left:2px solid var(--ink)}
.sbars .val{font-variant-numeric:tabular-nums;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sbars .val b{color:var(--ink);font-size:15px}
.sbars .val svg{width:16px;height:16px;color:var(--good)}
.exblock{margin-top:14px}
.exblock h4{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0 0 4px}
.logrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
.logrow:first-child{border-top:0}
.logrow .ln{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.logrow .lm{font-weight:700;font-variant-numeric:tabular-nums}

/* stimulus charts */
.stim{margin:10px 0 6px}
.stim table.data{font-size:15px}

/* lessons */
.point{padding:14px 0;border-top:1px solid var(--rule)}
.point:first-child{border-top:0}
.point h4{font-size:17px;margin:0 0 4px}
.point p{margin:0 0 6px;color:var(--ink2)}
.exl{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font-size:16px;color:var(--ink)}
.exl svg{width:18px;height:18px;margin-top:3px;flex:none}
.exl.bad{color:var(--ink2)}
.exl.bad svg{color:var(--red)}
.exl.good svg{color:var(--good)}
.lprog{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin:12px 0 16px}
.lprog i{display:block;height:100%;background:var(--ink);border-radius:0 3px 3px 0;transition:width .2s}
.lq{font-weight:700;font-size:18px;line-height:1.4;margin:0 0 12px}
.ls{font-size:18px;line-height:1.8;margin:0 0 14px}
.ls.wrongline{display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}
.ls.wrongline svg{width:20px;height:20px;margin-top:6px;color:var(--red);flex:none}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink2);color:transparent;line-height:1.1}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--rule2);border-radius:10px;background:var(--sheet);color:var(--ink);font-size:16px;line-height:1.45;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--ink2)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt svg{width:18px;height:18px;flex:none;margin-top:2px}
.opt.right svg{color:var(--good)}
.opt.wrong svg{color:var(--red)}
.gap-inp{display:inline-block;width:auto;max-width:100%;margin:0 4px;padding:2px 8px;border:0;border-bottom:2px solid var(--ink2);border-radius:6px 6px 0 0;background:var(--accent-soft);color:var(--ink);font-size:18px;font-weight:700;line-height:1.5}
.gap-inp:focus{outline:none;border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.gap-inp.right{border-bottom-color:var(--good)}
.gap-inp.wrong{border-bottom-color:var(--red)}
.fixbox{font-size:17px;line-height:1.5;resize:vertical;min-height:76px}
.fixbox.right{border-color:var(--good)}
.fixbox.wrong{border-color:var(--red)}
.answerline{margin:8px 0 0;font-size:16px}
.olist{margin:6px 0 0;padding-left:22px}
.olist li{margin:2px 0}
.why{color:var(--ink2);margin:6px 0 0}
.chunk.block{display:block;width:100%;text-align:left;line-height:1.45}
.answer.stack,.bank.stack{flex-direction:column;align-items:stretch}
.answer.stack{min-height:64px}

/* corrections */
.pre{white-space:pre-wrap}
.quote{margin:8px 0 12px;padding:6px 0 6px 14px;border-left:3px solid var(--rule2);color:var(--ink2);font-style:italic}
.inset{margin:10px 0;padding:12px 14px;border-radius:10px;background:var(--bg)}
.marked{white-space:pre-wrap;line-height:1.95;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);overflow-wrap:anywhere;font-size:16px}
mark.lt{background:transparent;color:inherit;text-decoration:underline wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-skip-ink:none}
mark.lt.st{text-decoration:underline dotted var(--accent);text-decoration-thickness:2px}
mark.lt sup{font-size:11px;font-weight:700;color:var(--red);margin-left:2px;line-height:0}
mark.lt.st sup{color:var(--accent)}
.issues{list-style:none;padding:0;margin:12px 0 0}
.issues li{padding:11px 0;border-top:1px solid var(--rule);line-height:1.5}
.issues li:first-child{border-top:0}
.issues .n{display:inline-block;min-width:22px;font-weight:700;color:var(--muted)}
.itag{display:inline-block;font-size:12px;font-weight:700;line-height:1.4;padding:1px 8px;border-radius:999px;border:1.5px solid var(--rule2);color:var(--ink2);margin-right:8px;vertical-align:1px}
del{color:var(--red);text-decoration-thickness:1.5px}
ins{color:var(--good);text-decoration:none;font-weight:700}
.okline{display:flex;gap:10px;align-items:flex-start}
.okline svg{width:20px;height:20px;color:var(--good);flex:none;margin-top:2px}
.checks{list-style:none;margin:0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--rule)}
.checks li:first-child{border-top:0}
.checks svg{width:20px;height:20px;flex:none;margin-top:1px}
.checks .ok svg{color:var(--good)}
.checks .warn svg{color:var(--warn)}
.scoreline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.scorebig{font-family:var(--font-display);font-size:46px;font-weight:760;line-height:1;letter-spacing:-.02em}
.fbrows{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px 14px;align-items:baseline;margin-top:16px;font-size:15px}
.fbrows .fn{font-weight:700}
.fbrows .fs{font-weight:700;font-variant-numeric:tabular-nums}
.fbrows .fc{color:var(--ink2)}
@media (max-width:560px){.fbrows{grid-template-columns:minmax(0,1fr) auto}.fbrows .fc{grid-column:1/-1;margin:-4px 0 6px}}
.sub4{font-size:16px;font-weight:700;margin:18px 0 0}

/* today */
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--good);color:var(--sheet)}
.daydone{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.daydone svg{width:28px;height:28px;flex:none;padding:5px;border-radius:50%;background:var(--good);color:var(--sheet)}
.daydone p{margin:2px 0 0}

/* words hub */
.wgrid{display:grid;gap:12px;margin-top:14px}
@media (min-width:640px){.wgrid{grid-template-columns:1fr 1fr}}
.wcard{display:flex;flex-direction:column;align-items:flex-start}
.wcard h3{font-family:var(--font-display);font-weight:700;font-size:20px;margin:10px 0 4px}
.wcard p{margin:0;color:var(--ink2)}
.wcard .actions{margin-top:auto;padding-top:12px}
.wcard .seg{margin-top:12px;max-width:100%}
.wcard .seg button{padding:8px 11px}
.wicon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:var(--accent-soft);background:color-mix(in srgb,var(--c) 16%,transparent)}
.wicon svg{width:24px;height:24px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:14px 0;border-top:1px solid var(--rule)}
.setrow:first-child{border-top:0}
.setrow h4{font-size:17px}
.setrow p{margin:2px 0 0;color:var(--muted);font-size:14px}
.setrow>.btn{margin-top:2px}
.setprog{display:flex;align-items:center;gap:10px;margin-top:8px}
.pbar{display:block;flex:1 1 auto;max-width:220px;min-width:48px;height:7px;border-radius:4px;background:var(--rule);overflow:hidden}
.setprog .small{white-space:nowrap}
.pbar i{display:block;height:100%;background:var(--s-vocab);border-radius:0 4px 4px 0}
.setlist{grid-column:1/-1;margin-top:6px}
.setwords{list-style:none;margin:8px 0 4px;padding:0;columns:2 230px;column-gap:28px;font-size:15px}
.setwords li{break-inside:avoid;padding:3px 0;color:var(--ink2)}
.setwords li b{color:var(--ink)}
.setwords li.got b::before{content:"\2713\00a0";color:var(--good)}
details.addword{margin-top:16px}
details.addword summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0;list-style-position:inside}
.flash.learn{padding-top:20px}
.flash .lset{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.flash .def{color:var(--ink2);margin:6px auto 0;max-width:46ch}
.flash .ex b{font-style:normal;background:var(--hi);color:var(--hi-ink);border-radius:3px 6px 3px 6px;padding:0 .2em}
.flash .meaning{font-weight:700}
.iconbtn.big{width:48px;height:48px;margin:4px auto 0}
.iconbtn.big svg{width:26px;height:26px}
.typein{max-width:380px;margin:16px auto 0;text-align:center;font-size:20px}
.feedback.center{justify-content:center;text-align:left}
.donecard{text-align:left;margin-top:14px}
.donecard h2{margin:10px 0 6px}

/* complete the words */
.cwtext{font-size:18px;line-height:2.25;margin-top:6px}
.cw{white-space:nowrap}
.cwi{font:700 17px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;padding:1px 4px;margin:0 2px 0 1px;border:0;border-bottom:2px solid var(--ink2);border-radius:6px 6px 0 0;background:var(--accent-soft);color:var(--ink);vertical-align:baseline}
.cwi:focus{outline:none;border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.cwi.right{border-bottom-color:var(--good);color:var(--good)}
.cwi.wrong{border-bottom-color:var(--red);color:var(--red);text-decoration:line-through}
.cwfix{font-weight:700;color:var(--good);margin:0 4px 0 2px;font-size:16px}

/* corrections: not a mistake, own dictionary */
.okbtn{display:inline-block;margin-top:6px;font-size:13px;color:var(--muted)}
.okbtn:hover{color:var(--accent)}
.dictlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 11px;border:1.5px solid var(--rule2);border-radius:999px;font-size:14px;font-weight:700;background:var(--sheet)}
.dchip button{display:inline-grid;place-items:center;width:26px;height:26px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer}
.dchip button:hover{background:var(--accent-soft);color:var(--ink)}
.dchip svg{width:15px;height:15px}
@media (max-width:420px){.seg button{padding:8px 11px}}

/* dialog and toast */
dialog{border:0;padding:0;border-radius:16px;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);background:var(--sheet);color:var(--ink);box-shadow:0 24px 70px rgba(8,12,24,.4)}
dialog::backdrop{background:rgba(8,12,24,.55)}
.dlg{padding:20px}
.dlg h2{margin-top:0}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){#toast{bottom:28px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (forced-colors: active){body::before{display:none}.cell.full,.cell.part,.check:checked{forced-color-adjust:none;background:CanvasText}.hl{border:1px solid CanvasText}}
</style>

<script>
/* ============================================================
   Content: plan, lessons, prompts and practice sets.
   All prompts and chart data are original and invented for practice.
   ============================================================ */
const LINKS = {
  toeflBook: 'https://www.ets.org/toefl/test-takers/ibt/register.html',
  ieltsBook: 'https://ielts.org/test-centres/british-council-austria',
  toeflFormat: 'https://www.ets.org/toefl/test-takers/ibt/about/content.html',
  toeflPrep: 'https://www.ets.org/toefl/test-takers/ibt/prepare/practice-tests.html',
  ieltsPrep: 'https://takeielts.britishcouncil.org/take-ielts/prepare/free-ielts-practice-tests',
  claudeKeys: 'https://platform.claude.com/settings/keys'
};

const SKILLS = [
  { id: 'reading', name: 'Reading' },
  { id: 'listening', name: 'Listening' },
  { id: 'writing', name: 'Writing' },
  { id: 'vocab', name: 'Vocabulary' },
  { id: 'speaking', name: 'Speaking' },
  { id: 'mock', name: 'Tests and review' }
];

/* The 28 days are split into three chapters. */
const PARTS = [
  { name: 'Foundations', days: 10, goal: 'Ten short lessons on the English the exams test: sentences, tenses, articles, vocabulary, linking words, paragraphs, essays, charts, emails and speaking. Every exercise corrects itself, and the app checks what you write.' },
  { name: 'Learn the test formats', days: 7, goal: 'Try every real task type, take your first full tests at the weekend, and find the sections that cost you the most.' },
  { name: 'Timed practice and mocks', days: 11, goal: 'Timed writing and recorded speaking most days, two full mocks at the weekend, then review and rest. Nothing new in the last two days.' }
];

const HABITS = [
  { id: 'learn', t: 'Learn new words', s: 'vocab', m: 10, go: 'words:learn' },
  { id: 'words', t: 'Review your due words', s: 'vocab', m: 10, go: 'words:review' },

/* ---------- Chapter 1 lessons ----------
   Exercise types:
   choice: q, optional s (sentence with ___), o (options), a (index of the right option)
   gap:    q, s (sentence with one ___), a (accepted answers)
   fix:    q, w (wrong sentence), a (accepted corrections)
   order:  q, items (in the right order)
*/
const LESSONS = [
  { id: 'L1', title: 'Sentence basics', skill: 'writing', goal: 'Write complete, correct sentences every time.',
    points: [
      { h: 'Every sentence needs a subject', p: 'Greek can leave the subject out ("Είναι σημαντικό να κοιμάσαι καλά"). English never does. When there is no real subject, use "it" or "there".',
        bad: 'Is important to sleep well.', good: 'It is important to sleep well.' },
      { h: '"There is" and "there are" for things that exist', p: 'Greek often uses "έχει" here ("Έχει πολλά καφέ στο Ναύπλιο"). In English that is "there is" or "there are", not "it has".',
        bad: 'In my town it has a beautiful castle.', good: 'In my town there is a beautiful castle.' },
      { h: 'Word order: subject, verb, object, place, time', p: 'Keep the verb and its object together. "Very much" goes after the object, and place comes before time.',
        bad: 'I like very much my job. I go every day to the lab.', good: 'I like my job very much. I go to the lab every day.' },
      { h: 'Do not join two sentences with only a comma', p: 'Two complete sentences need a full stop or a joining word such as and, but, so or because. A comma on its own is one of the most common mistakes in exam writing.',
        bad: 'The test is long, I need to practise.', good: 'The test is long, so I need to practise.' }
    ],
    ex: [
      { type: 'choice', q: 'Which sentence is correct?', o: ['Is difficult to find a flat in Linz.', 'It is difficult to find a flat in Linz.', 'Difficult is to find a flat in Linz.'], a: 1, why: 'English needs a subject, so "it" fills the empty place: "It is difficult to..."' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['There are three labs in our building.', 'It has three labs in our building.', 'Has three labs in our building.'], a: 0, why: 'Use "there is" or "there are" to say that something exists.' },
      { type: 'choice', q: 'Which sentence has the right word order?', o: ['I read every morning the news.', 'I read the news every morning.', 'Every morning read I the news.'], a: 1, why: 'Verb and object stay together ("read the news"), and the time goes at the end.' },
      { type: 'gap', q: 'Fill the gap.', s: '___ is raining again today.', a: ['It'], why: 'Weather always takes "it": it is raining, it is cold.' },
      { type: 'gap', q: 'Fill the gap.', s: '___ are many reasons to study abroad.', a: ['There'], why: '"There are" + a plural noun says that something exists.' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'Is important to practise every day.', a: ['It is important to practise every day.'], why: 'Add the subject "it".' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'I like very much my job.', a: ['I like my job very much.', 'I really like my job.'], why: 'Keep the verb and object together ("like my job"), then "very much".' },
      { type: 'choice', q: 'Which sentence is punctuated correctly?', o: ['I was tired, I went to bed early.', 'I was tired, so I went to bed early.', 'I was tired so, I went to bed early.'], a: 1, why: 'Two full sentences need a joining word such as "so", or a full stop. A comma alone is not enough.' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'In Nafplio has many old buildings.', a: ['In Nafplio there are many old buildings.', 'There are many old buildings in Nafplio.', 'Nafplio has many old buildings.'], why: 'Use "there are", or make Nafplio the subject: "Nafplio has many old buildings."' }
    ],
    apply: { kind: 'write', id: 'g-L1' } },

  { id: 'L2', title: 'The tenses you need', skill: 'writing', goal: 'Choose the right tense for facts, the past, time up to now, and plans.',
    points: [
      { h: 'Present simple for facts, present continuous for now', p: 'Use the present simple for facts and habits, and the present continuous for things happening now or for a short time. Verbs like know, like, want, need and believe are almost never used in the continuous form.',
        bad: 'I am knowing the answer. I am needing more time.', good: 'I know the answer. I need more time.' },
      { h: 'Past simple for finished time', p: 'With a finished time (yesterday, last week, in 2023, two days ago), use the past simple, never the present perfect.',
        bad: 'Yesterday I have finished my report.', good: 'Yesterday I finished my report.' },
      { h: 'Present perfect with since and for', p: 'Greek uses the present for something that started in the past and is still true ("Μένω στο Λιντς από τον Αύγουστο"). English needs the present perfect. Use "since" with a starting point and "for" with a length of time.',
        bad: 'I live in Linz since August.', good: 'I have lived in Linz since August. I have been here for two months.' },
      { h: 'Plans and arrangements', p: 'Use "going to" for plans and the present continuous for things already arranged. Use "will" for decisions you make while speaking and for predictions.',
        bad: 'I am going take the IELTS in November.', good: 'I am going to take the IELTS in November. I am meeting my supervisor on Friday.' }
    ],
    ex: [
      { type: 'gap', q: 'Fill the gap with the right form of "work".', s: 'I ___ on my thesis since June.', a: ['have been working', 'have worked'], why: 'It started in the past and is still true, with "since": present perfect (simple or continuous).' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['I know him for five years.', 'I have known him for five years.', 'I am knowing him for five years.'], a: 1, why: 'A situation that started in the past and continues takes the present perfect. "Know" is not used in the continuous.' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['Last week I have started a new project.', 'Last week I started a new project.', 'Last week I am starting a new project.'], a: 1, why: '"Last week" is finished time, so use the past simple.' },
      { type: 'gap', q: 'Since or for?', s: 'She has lived in Vienna ___ 2022.', a: ['since'], why: '"Since" + a starting point (2022, Monday, I was ten).' },
      { type: 'gap', q: 'Since or for?', s: 'We have been waiting ___ two hours.', a: ['for'], why: '"For" + a length of time (two hours, three years).' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['I am needing more time for the essay.', 'I need more time for the essay.'], a: 1, why: '"Need" is a state verb, so it stays in the simple form.' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'I study English since I was ten.', a: ['I have studied English since I was ten.', 'I have been studying English since I was ten.'], why: 'With "since", use the present perfect: "I have studied" or "I have been studying".' },
      { type: 'choice', q: 'You booked the test yesterday. Which is best?', o: ['I will taking the TOEFL next month.', 'I am taking the TOEFL next month.', 'I taking the TOEFL next month.'], a: 1, why: 'For something already arranged, use the present continuous (or "going to").' }
    ],
    apply: { kind: 'write', id: 'g-L2' } },

  { id: 'L3', title: 'Articles and prepositions', skill: 'writing', goal: 'Stop the small mistakes that examiners notice in almost every sentence.',
    points: [
      { h: 'No "the" for general ideas', p: 'Greek puts an article before general nouns ("Η τεχνολογία αλλάζει τη ζωή μας"). English does not. Use "the" only when you mean something specific.',
        bad: 'The technology changes the life of the people.', good: 'Technology changes people\'s lives. (But: the technology in our lab is new.)' },
      { h: '"A" or "an" with jobs and single things', p: 'Greek says "Είμαι μηχανικός" with no article. English needs "a" or "an" before a singular job or countable noun. Use "an" before a vowel sound: an engineer, an hour.',
        bad: 'I am engineer and I have car.', good: 'I am an engineer and I have a car.' },
      { h: 'No article with most names', p: 'People, cities and most countries take no article: Maria, Vienna, Greece, Austria. Exceptions include the UK, the USA and the Netherlands.',
        bad: 'The Maria moved to the Austria.', good: 'Maria moved to Austria.' },
      { h: 'Prepositions Greek speakers often mix up', p: 'depend on (not "from"), interested in, good at, arrive in a city or at a place, on Monday, in October, at 9 o\'clock. "Discuss" and "explain" take no "about" and no "me": discuss a problem, explain something to someone.',
        bad: 'It depends from the weather. Can you explain me the results?', good: 'It depends on the weather. Can you explain the results to me?' }
    ],
    ex: [
      { type: 'choice', q: 'Which sentence is correct?', o: ['The life in a big city is expensive.', 'Life in a big city is expensive.'], a: 1, why: 'Life in general takes no article.' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['My brother is doctor.', 'My brother is a doctor.', 'My brother is the doctor.'], a: 1, why: 'Jobs take "a" or "an".' },
      { type: 'gap', q: 'Fill the gap.', s: 'It depends ___ the weather.', a: ['on'], why: '"Depend on", never "depend from".' },
      { type: 'gap', q: 'Fill the gap.', s: 'I am interested ___ neuroscience.', a: ['in'], why: '"Interested in".' },
      { type: 'gap', q: 'Fill the gap.', s: 'My exam is ___ November.', a: ['in'], why: 'Months and years take "in", days take "on", clock times take "at".' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'Can you explain me the results?', a: ['Can you explain the results to me?', 'Could you explain the results to me?'], why: '"Explain something to someone".' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'We discussed about the new project.', a: ['We discussed the new project.', 'We talked about the new project.'], why: '"Discuss" takes its object directly, with no "about". "Talk about" does take "about".' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['I arrived to Vienna at night.', 'I arrived in Vienna at night.', 'I arrived at Vienna in night.'], a: 1, why: '"Arrive in" a city or country, "arrive at" a building, and "at night".' },
      { type: 'choice', q: 'Which sentence is better for an essay?', o: ['The education is important for the society.', 'Education is important for society.'], a: 1, why: 'Education and society in general take no article.' }
    ],
    apply: { kind: 'write', id: 'g-L3' } },

  { id: 'L4', title: 'Words that score higher', skill: 'vocab', goal: 'Use precise, formal words and natural word partners.',
    points: [
      { h: 'Replace weak words', p: 'Examiners reward precise words. Swap "very good" for excellent or effective, "very big" for huge or significant, "thing" for aspect, factor or issue, "a lot of" for many or a large number of, and "bad" for harmful or negative.',
        bad: 'Technology has a lot of good things.', good: 'Technology has many benefits.' },
      { h: 'Formal style for essays', p: 'In IELTS essays: no contractions (write "do not" and "it is"), no slang (kids, stuff, gonna), and do not start sentences with "And" or "So".',
        bad: 'Kids don\'t play outside a lot and it\'s not good.', good: 'Children do not spend much time outdoors, which is a concern.' },
      { h: 'Word partners (collocations)', p: 'Greek "κάνω" can be do, make or take in English. Learn the pairs: do research, make a decision, take a break, pay attention, play a role in, have an impact on, meet a deadline.',
        bad: 'I made a research about BCIs.', good: 'I did research on BCIs.' },
      { h: 'Uncountable nouns', p: 'information, advice, research, equipment, knowledge, evidence, homework and news have no plural and no "a" or "an".',
        bad: 'They gave me many informations and an advice.', good: 'They gave me a lot of information and some advice.' }
    ],
    ex: [
      { type: 'choice', q: 'Choose the right verb.', s: 'Scientists ___ research on the brain.', o: ['do', 'make', 'play'], a: 0, why: '"Do research" (or carry out research, conduct research).' },
      { type: 'choice', q: 'Choose the right verb.', s: 'Social media ___ an important role in young people\'s lives.', o: ['does', 'plays', 'makes'], a: 1, why: '"Play a role in".' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['I need some advices.', 'I need some advice.', 'I need an advice.'], a: 1, why: '"Advice" is uncountable.' },
      { type: 'choice', q: 'Which sentence is best for an IELTS essay?', o: ['Kids nowadays don\'t play outside a lot.', 'Children today spend less time playing outside.', 'Kids today don\'t play outside much, you know.'], a: 1, why: 'Formal words, no contractions, and no spoken phrases like "you know".' },
      { type: 'gap', q: 'Fill the gap (προθεσμία).', s: 'We have to meet the ___ by Friday.', a: ['deadline'], why: '"Meet a deadline".' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'They gave me a lot of informations.', a: ['They gave me a lot of information.', 'They gave me much information.', 'They gave me plenty of information.'], why: '"Information" has no plural.' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'I made a research about EEG.', a: ['I did research on EEG.', 'I did some research on EEG.', 'I did research about EEG.', 'I carried out research on EEG.', 'I conducted research on EEG.'], why: '"Do research", with no "a" because research is uncountable, usually "on" a topic.' },
      { type: 'choice', q: 'Choose the stronger word.', s: 'Air pollution has a ___ effect on health.', o: ['very bad', 'harmful', 'not good'], a: 1, why: '"Harmful" is precise and formal.' }
    ],
    apply: { kind: 'write', id: 'g-L4' } },

  { id: 'L5', title: 'Linking words', skill: 'writing', goal: 'Connect ideas clearly and punctuate linking words correctly.',
    points: [
      { h: 'The main groups', p: 'Adding: moreover, in addition, also. Contrast: however, although, whereas, on the other hand, despite. Cause and result: because, since, therefore, as a result. Examples: for example, for instance, such as.',
        good: 'Buses are cheap. However, they are often slow. As a result, many people still drive.' },
      { h: 'Although + a sentence, despite + a noun', p: 'Greek "παρόλο που" is "although" and is followed by a full sentence. Greek "παρά" is "despite" and is followed by a noun or an -ing word.',
        bad: 'Despite it was expensive, I bought it.', good: 'Although it was expensive, I bought it. Despite the high price, I bought it.' },
      { h: '"However" starts a new sentence', p: 'Put a full stop (or a semicolon) before "However" and a comma after it. Do not join two sentences with ", however" alone.',
        bad: 'The course is useful, however it is expensive.', good: 'The course is useful. However, it is expensive.' },
      { h: '"Such as" inside a sentence', p: 'Use "such as" to list examples inside a sentence. "For example" usually starts a new sentence or follows a comma.',
        good: 'Some countries, such as Austria and Germany, have excellent public transport.' }
    ],
    ex: [
      { type: 'choice', q: 'Choose the right word.', s: '___ the rain, we went for a walk.', o: ['Although', 'Despite', 'However'], a: 1, why: '"Despite" + a noun ("the rain").' },
      { type: 'choice', q: 'Choose the right word.', s: '___ it was late, she kept working.', o: ['Despite', 'Although', 'Moreover'], a: 1, why: '"Although" + a full sentence ("it was late").' },
      { type: 'choice', q: 'Choose the right word.', s: 'The flat is small. ___, it is close to the office.', o: ['Therefore', 'However', 'Because'], a: 1, why: 'The second idea contrasts with the first.' },
      { type: 'choice', q: 'Choose the right word.', s: 'He did not study. ___, he failed the test.', o: ['As a result', 'Although', 'Despite'], a: 0, why: 'Failing is the result of not studying.' },
      { type: 'choice', q: 'Which is punctuated correctly?', o: ['The test is hard, however I will pass it.', 'The test is hard. However, I will pass it.', 'The test is hard however, I will pass it.'], a: 1, why: 'A full stop before "However" and a comma after it.' },
      { type: 'gap', q: 'Fill the gap.', s: 'Many countries, ___ as Austria and Germany, invest in railways.', a: ['such'], why: '"Such as" introduces examples inside a sentence.' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'Despite it was raining, the match continued.', a: ['Although it was raining, the match continued.', 'Despite the rain, the match continued.', 'Even though it was raining, the match continued.', 'In spite of the rain, the match continued.'], why: '"Although" + a sentence, or "despite" + a noun.' },
      { type: 'choice', q: 'Choose the right word.', s: 'Some people prefer cities, ___ others prefer the countryside.', o: ['whereas', 'despite', 'therefore'], a: 0, why: '"Whereas" contrasts two groups in one sentence.' }
    ],
    apply: { kind: 'write', id: 'g-L5' } },

  { id: 'L6', title: 'The paragraph', skill: 'writing', goal: 'Build every body paragraph the same reliable way: point, explain, example, link.',
    points: [
      { h: 'One paragraph, one idea', p: 'Each body paragraph develops one main idea. Its first sentence, the topic sentence, says what that idea is.' },
      { h: 'Point, explain, example, link', p: 'Point: the topic sentence. Explain: why or how it is true. Example: one specific case. Link: show how it answers the question.',
        good: 'One major benefit of working from home is that employees save time. Without a daily commute, they can rest, exercise or start work earlier. For instance, someone who travels an hour each way gains ten hours a week. This extra time can improve both productivity and well-being.' },
      { h: 'Develop ideas, do not list them', p: 'A paragraph that lists four ideas in four short sentences scores lower than one that explains a single idea well.',
        bad: 'Public transport should be free. This would reduce traffic. Also it would help the environment. And people would save money.' },
      { h: 'Use specific examples', p: 'A good example names a situation, a group of people or a number. "Many people say this" is not an example.' }
    ],
    ex: [
      { type: 'order', q: 'Put the sentences in order to make a strong paragraph.', items: [
        'Learning a language abroad speeds up progress.',
        'This is because learners hear and use the language all day, not only in class.',
        'For example, students who spend a semester in the UK often improve their speaking more than in a year of lessons at home.',
        'Therefore, time abroad can be one of the most effective ways to learn.'], why: 'Point, then explanation, then a specific example, then the link back to the question.' },
      { type: 'choice', q: 'Which is the best topic sentence for a paragraph about the disadvantages of tourism?', o: ['Tourism is a big industry in many countries.', 'However, tourism can also damage the daily life of local residents.', 'I went to Santorini last summer.'], a: 1, why: 'It states one clear idea that the paragraph will develop.' },
      { type: 'choice', q: 'Which example is specific enough?', o: ['For example, many people think this is true.', 'For example, on many popular islands local families can no longer rent a home, because flats are let to tourists instead.', 'For example, it is very good.'], a: 1, why: 'It names a situation and a consequence.' },
      { type: 'order', q: 'Put the sentences in order.', items: [
        'Too much screen time can harm children\'s sleep.',
        'Bright screens late in the evening make it harder for the brain to switch off.',
        'For instance, a child who plays games on a tablet before bed may fall asleep an hour later than usual.',
        'For this reason, parents should set clear limits in the evening.'], why: 'Point, explain, example, link.' },
      { type: 'choice', q: 'What is the main problem with this paragraph? "Public transport should be free. This would reduce traffic. Also it would help the environment. And people would save money."', o: ['It has no topic sentence.', 'It lists ideas without explaining any of them.', 'It uses too many linking words.'], a: 1, why: 'Four ideas and none of them developed. Pick one and explain it with an example.' }
    ],
    apply: { kind: 'write', id: 'g-L6' } },

  { id: 'L7', title: 'Building a Task 2 essay', skill: 'writing', goal: 'Plan and structure an IELTS essay so it answers the whole question.',
    points: [
      { h: 'Find the question type', p: 'Opinion: "To what extent do you agree or disagree?" Discussion: "Discuss both views and give your own opinion." Advantages and disadvantages: "Do the advantages outweigh the disadvantages?" Problem and solution: "What problems... and what can be done?" Two-part: two direct questions. Answer every part.' },
      { h: 'Plan for five minutes', p: 'Decide your position first. Choose two main ideas and one specific example for each. Then start writing.' },
      { h: 'Introduction: paraphrase and position', p: 'Two sentences. Say what the question is about in your own words, then give your position. Do not copy the question.',
        good: 'Some argue that public money should go to buses and trains rather than to new roads. I largely agree, because public transport reduces both congestion and pollution.' },
      { h: 'Four paragraphs, about 270 words', p: 'Introduction, two body paragraphs (point, explain, example, link) and a short conclusion that restates your position. No new ideas in the conclusion.' }
    ],
    ex: [
      { type: 'choice', q: 'What type of question is this? "Some people think university should be free. Others believe students should pay. Discuss both views and give your own opinion."', o: ['Opinion', 'Discussion', 'Problem and solution', 'Advantages and disadvantages'], a: 1, why: 'It asks for both views plus your own opinion.' },
      { type: 'choice', q: 'What type of question is this? "Many cities have serious traffic. What problems does this cause, and what can be done about it?"', o: ['Opinion', 'Discussion', 'Problem and solution', 'Advantages and disadvantages'], a: 2, why: 'It asks for problems and for solutions.' },
      { type: 'choice', q: 'What type of question is this? "Exams are the best way to assess students. To what extent do you agree or disagree?"', o: ['Opinion', 'Discussion', 'Problem and solution', 'Two-part'], a: 0, why: 'It asks how far you agree, so give a clear position.' },
      { type: 'choice', q: 'Which is the best paraphrase of "Many young people are leaving rural areas to live in cities"?', o: ['Many young people are leaving rural areas to live in cities, which is a problem.', 'A growing number of young adults are moving from the countryside to urban areas.', 'Young people is leaving villages for go to cities.'], a: 1, why: 'Same meaning, new words, correct grammar.' },
      { type: 'choice', q: 'Which is the best position statement for "Do the advantages of working from home outweigh the disadvantages?"', o: ['In this essay I will talk about working from home.', 'In my view, the benefits of working from home, such as saved time and flexibility, outweigh the drawbacks.', 'Working from home is good and bad.'], a: 1, why: 'A clear answer to the question, with a hint of the reasons.' },
      { type: 'choice', q: 'Which of these does not belong in a conclusion?', o: ['Your position, restated', 'A summary of your main reasons', 'A new argument'], a: 2, why: 'New ideas belong in the body paragraphs.' },
      { type: 'order', q: 'Put the parts of the essay in order.', items: ['Introduction: paraphrase and position', 'Body 1: first reason with an example', 'Body 2: second reason with an example', 'Conclusion: restate your position'], why: 'This four-paragraph structure works for every Task 2 type.' }
    ],
    apply: { kind: 'write', id: 'g-L7' } },

  { id: 'L8', title: 'Describing charts', skill: 'writing', goal: 'Learn the language of trends and comparisons for IELTS Task 1.',
    points: [
      { h: 'Trend words', p: 'Up: rise, increase, grow, climb. Down: fall, decrease, decline, drop. Other: fluctuate, remain stable, level off, peak at, reach a low of.',
        good: 'The share of cyclists rose from 6% to 17%, while car use fell steadily.' },
      { h: 'Adjective + noun, or verb + adverb', p: 'Write "a sharp rise" or "rose sharply", and "a slight decrease" or "decreased slightly". Never "increased sharp".',
        bad: 'The number increased sharp in 2020.', good: 'The number increased sharply in 2020. There was a sharp increase in 2020.' },
      { h: 'Numbers and comparisons', p: 'from 20% to 35%, by 15 percentage points, twice as many as, the largest share, just over a third, approximately half.',
        good: 'In 2026, nearly three times as many people cycled to work as in 2006.' },
      { h: 'Always write an overview', p: 'After the introduction, write one or two sentences with the main trends and no detailed numbers. Start with "Overall,". Never give your opinion in Task 1.',
        good: 'Overall, car use declined while train and bicycle use grew, although the car remained the most common way to travel.' }
    ],
    ex: [
      { type: 'choice', q: 'Which sentence is correct?', o: ['Sales increased sharp in 2020.', 'Sales increased sharply in 2020.', 'Sales sharp increased in 2020.'], a: 1, why: 'Verb + adverb: increased sharply.' },
      { type: 'choice', q: 'Which sentence is correct?', o: ['There was a dramatically rise in prices.', 'There was a dramatic rise in prices.'], a: 1, why: 'Adjective + noun: a dramatic rise.' },
      { type: 'gap', q: 'Fill the gap with one word that means "stayed".', s: 'The figure ___ stable at 40% between 2010 and 2015.', a: ['remained', 'stayed'], why: '"Remained stable" is the most common phrase.' },
      { type: 'choice', q: 'Which is the best overview for a chart of weekly online study hours in four faculties from 2016 to 2026?', o: ['Overall, online study increased in every faculty, rising sharply in 2020, and for most of the period Engineering students studied online the most.', 'In 2016 Engineering students studied online for 4 hours.', 'I think online learning is useful for students.'], a: 0, why: 'Main trends, no detailed numbers, no opinion.' },
      { type: 'gap', q: 'Fill the gap.', s: 'The share of cyclists rose ___ 6% to 17%.', a: ['from'], why: '"From X to Y".' },
      { type: 'choice', q: 'Choose the right word.', s: 'Between 2006 and 2026, car use fell ___ 18 percentage points.', o: ['by', 'with', 'at'], a: 0, why: '"By" shows the size of the change.' },
      { type: 'fix', q: 'Rewrite the sentence correctly.', w: 'The percentage of people who walk decreased slight.', a: ['The percentage of people who walk decreased slightly.', 'The percentage of people who walked decreased slightly.'], why: 'Verb + adverb: decreased slightly.' }
    ],
    apply: { kind: 'write', id: 'g-L8' } },

  { id: 'L9', title: 'Emails and discussion posts', skill: 'writing', goal: 'Write polite, clear emails and strong academic posts for the TOEFL.',
    points: [
      { h: 'Email structure', p: 'Greeting (Dear Dr. Hartmann, or Hi Daniel,), one line saying why you are writing, a short part for each of the three points, a polite close (Best regards, Kind regards, Thanks,) and your name. Cover all three points or you lose marks.' },
      { h: 'Polite requests', p: 'Use "Could you...?", "Would it be possible to...?", "I was wondering if..." or "I would appreciate it if...". Avoid orders such as "I want you to..." or "Send me...".',
        bad: 'I want you to change the date.', good: 'Would it be possible to move my presentation to Monday?' },
      { h: 'The right tone', p: 'To a friend you can be relaxed and use contractions. To a professor or a manager, be friendly but polite, with no slang.' },
      { h: 'Academic discussion posts', p: 'Answer the professor\'s question in your first sentence, mention a classmate\'s idea, then add a new reason or example that nobody has given. Around 120 words is enough.',

function dayStatus(di) {
  let total = 0, done = 0;
  PLAN[di].tasks.forEach((t, ti) => { if (t.opt) return; total++; if (state.done[tid(di, ti)]) done++; });
  return { total, done };
}
function partStatus(p) {
  const [a, b] = partRange(p);
  let total = 0, done = 0;
  for (let di = a; di <= b; di++) { const s = dayStatus(di); total += s.total; done += s.done; }
  return { total, done };
}

  const upTo = Math.min(dayIdx(todayISO()), N);

  return out;
}
function addLog(o) {

}

  const id = tid(di, ti), t = PLAN[di].tasks[ti];

}

  if (!tts.ok) { setTimeout(() => fin(false), 0); return fin; }

    u.onerror = e => fin(!!(e && (e.error === 'interrupted' || e.error === 'canceled')));

  if (!m) return '#ffffff';

  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
  const L = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  return L > 0.36 ? '#1B2333' : '#FFFFFF';
}

const CONTRACT = [
  [/\bcan't\b/g, 'cannot'], [/\bwon't\b/g, 'will not'], [/n't\b/g, ' not'], [/\bi'm\b/g, 'i am'], [/'re\b/g, ' are'],
  [/'ve\b/g, ' have'], [/'ll\b/g, ' will'], [/\b(it|that|there|what|he|she|who|here)'s\b/g, '$1 is'],
  [/\blet's\b/g, 'let us'], [/\b(i|you|we|they|he|she)'d\b/g, '$1 would'], [/\bcan not\b/g, 'cannot']
];
/* loose comparison: case, contractions, British/American spelling and punctuation do not matter */
function normAns(s) {
  let t = String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”]/g, '"');
  CONTRACT.forEach(([re, rep]) => { t = t.replace(re, rep); });
  t = t.replace(/\bpractis/g, 'practic').replace(/([a-z])is(e|es|ed|ing|ation)\b/g, '$1iz$2').replace(/\b(colo|favo|behavio|neighbo|labo|hono)ur/g, '$1r');
  return t.replace(/[.,!?;:"()]/g, ' ').replace(/\s+/g, ' ').trim();
}
function openLesson(id) {
  const L = lessonById(id); if (!L) return;
  if (SP) { sCleanup(true); SP = null; }
  if (WR.running) wPause();
  BD = null;
  LS = { id, step: 'learn', i: 0, res: [], cur: null, t0: Date.now(), logged: false, focus: false };
  ui.tab = 'practice'; ui.pmode = 'lessons'; ui.pv = 'lesson';
  render(); scrollTop();
}
function prepItem() {
  const it = lessonById(LS.id).ex[LS.i];
  let order = null;
  if (it.type === 'order') {
    let tries = 0;
    do { order = shuffle(it.items.map((_, k) => k)); tries++; } while (tries < 12 && order.every((v, k) => v === k));

function feedbackRequest(e) {

function apiError(status, msg) {

  if (status === 529 || status === 503) return 'Claude is busy right now. Try again in a minute.';
  if (/credit|balance|billing/i.test(msg)) return 'Your Anthropic account has no credit left. Add some at platform.claude.com, then try again.';

async function getFeedback(id) {

  const model = state.settings.model;

    let res;
    try {
      res = await fetch(CLAUDE_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify(feedbackRequest(e))

    } catch (netErr) { throw new Error('Could not reach Claude. Check your internet connection and try again.'); }
    let j = null;

    if (!res.ok) throw new Error(apiError(res.status, (j && j.error && j.error.message) || ''));
    const tu = ((j && j.content) || []).find(c => c.type === 'tool_use');

        mistakes: Array.isArray(f.mistakes) ? f.mistakes.slice(0, 10) : [], improved: String(f.improved || ''), next: String(f.next_step || ''),
        model, at: Date.now()

}

/* ---------- Study time: stacked columns per day ---------- */
function chartDays() {

}
function drawStudy(box) {

  const vals = days.map(d => { const o = by.get(d) || {}; return { d, o, tot: SKILLS.reduce((a, s) => a + (o[s.id] || 0), 0) }; });
  const maxV = Math.max(goal, 30, ...vals.map(v => v.tot));

/* ---------- Overall score over time ---------- */
function drawOverall(box, ex) {
  const E = EXAMS[ex], target = targetOf(ex);

  if (hi - lo < 1.5) { lo = Math.max(E.min, lo - 0.5); hi = Math.min(E.max, hi + 0.5); }

  for (let v = lo; v <= hi + 1e-9; v += step) {
    const yy = Math.round(y(v)) + 0.5;
    s += '<line class="' + (v === lo ? 'base' : 'grid') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '"/>';
    s += '<text x="' + (m.l - 6) + '" y="' + yy + '" text-anchor="end" dominant-baseline="middle">' + v.toFixed(1) + '</text>';
  }
  const ty = Math.round(y(target)) + 0.5;
  s += '<line class="goal" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + ty + '" y2="' + ty + '"/>';
  s += '<text x="' + (m.l + 4) + '" y="' + (ty - 6) + '">Target ' + target.toFixed(1) + '</text>';
  if (n > 1) s += '<path d="' + pts.map((p, i) => (i ? 'L' : 'M') + x(i) + ',' + y(p.overall)).join('') + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<line class="cross" id="ov-cross-' + ex + '" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ph) + '" opacity="0"/>';

  s += '<text class="ink" x="' + (x(n - 1) + 9) + '" y="' + y(last.overall) + '" dominant-baseline="middle">' + last.overall.toFixed(1) + '</text>';
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw / 56))));

  });
  s += '<rect class="hit" x="' + m.l + '" y="' + m.t + '" width="' + pw + '" height="' + ph + '" tabindex="0" aria-label="' + esc(E.name + ' overall scores: ' + pts.map(p => fmtD(p.date) + ' ' + p.overall.toFixed(1)).join(', ')) + '"/>';
  s += '</svg>';

  const tip = $('.tip', box), cross = $('#ov-cross-' + ex, box), hit = $('.hit', box);
  const show = i => {

    let html = '<div class="tt">' + esc(fmtShort(p.date)) + (p.source ? ', ' + esc(p.source) : '') + '</div><div class="tr"><b>' + p.overall.toFixed(1) + '</b>overall</div>';

const INTERVAL = { 2: 1, 3: 3, 4: 7, 5: 14 };

/* ---------- the word bank ---------- */
const BANK = [];
const BANK_BY = new Map();
WORDSETS.forEach(S => S.words.forEach(w => {
  const k = w[0].toLowerCase();
  if (BANK_BY.has(k)) return;
  const e = { term: w[0], gr: w[1], en: w[2], ex: w[3], set: S.id };
  BANK.push(e); BANK_BY.set(k, e);
}));
const SET_BY = Object.fromEntries(WORDSETS.map(S => [S.id, S]));
const haveWords = () => new Set(state.words.map(w => w.term.toLowerCase()));
const setCount = (S, have) => S.words.filter(w => have.has(w[0].toLowerCase())).length;
function nextNew(n, setId, skip) {
  const have = haveWords(), out = [];
  for (const e of BANK) {
    if (out.length >= n) break;
    const k = e.term.toLowerCase();
    if ((setId && e.set !== setId) || have.has(k) || (skip && skip.has(k))) continue;
    out.push(e);
  }
  return out;
}
const newToday = () => { const t = todayISO(); return state.words.filter(w => w.src === 'bank' && w.added === t && !w.kn).length; };
/* a typed answer also counts when it is the US or UK form named in the definition, e.g. "(US: analyze)" */
function answersFor(term, def) {
  const out = [term];
  String(def || '').replace(/\((?:[^()]*?;\s*)?(?:US|UK)(?: also)?: ([^()]+)\)/g, (_, v) => { out.push(v.trim()); return ''; });
  return out;
}
const isAnswer = (val, term, def) => answersFor(term, def).some(a => normAns(a) === normAns(val));
const hintFor = t => 'Starts with "' + t[0] + '", ' + (/\s/.test(t.trim()) ? plural(t.trim().split(/\s+/).length, 'word') : plural(t.replace(/[^A-Za-z]/g, '').length, 'letter'));
const focusSel = sel => { const el = $(sel); if (el) el.focus({ preventScroll: true }); };
const sayBtn = (text, cls) => tts.ok ? '<button class="iconbtn' + (cls ? ' ' + cls : '') + '" data-act="say" data-text="' + esc(text) + '" aria-label="Hear ' + esc(text) + '">' + ICON.sound + '</button>' : '';
function exampleHTML(ex, term) {
  const t = term.trim();
  try { return esc(ex).replace(new RegExp('\\b' + reEsc(esc(t)) + '[A-Za-z]*', 'gi'), m => '<b>' + m + '</b>'); } catch (e) { return esc(ex); }
}
const resultHTML = (ok, given, term) => ok
  ? '<p class="feedback ok center">' + ICON.check + '<span>Correct: <b>' + esc(term) + '</b></span></p>'
  : '<p class="feedback no center">' + ICON.x + '<span>' + (given ? 'You wrote <del>' + esc(given) + '</del>. ' : '') + 'The word is <b class="ans">' + esc(term) + '</b></span></p>';
function addBankWord(e, knew) {
  const k = e.term.toLowerCase();
  if (state.words.some(w => w.term.toLowerCase() === k)) return;
  const t = todayISO();
  state.words.unshift({ id: uid(), term: e.term, meaning: e.gr, def: e.en, example: e.ex, box: knew ? 4 : 1, due: addDays(t, knew ? 7 : 1), added: t, reviews: 0, lapses: 0, src: 'bank', set: e.set, kn: knew ? 1 : 0 });
}

/* ---------- learning new words: cards first, then type each one ---------- */
function startLearn(setId) {
  const n = state.settings.newWords, list = nextNew(n, setId);
  if (!list.length) { toast(setId ? 'You have every word in this set already' : 'You have learned every word in the app'); return; }
  if (WV && !WV.finished) WV = null;
  LN = { setId: setId || '', queue: list.map(e => e.term), i: 0, phase: 'cards', target: n, learned: [], knew: [],
    seen: new Set(list.map(e => e.term.toLowerCase())), check: [], ci: 0, res: null, given: '', first: {}, t0: Date.now(), logged: false };
  ui.tab = 'words';
  render(); scrollTop();

}
const lnEntry = () => LN ? BANK_BY.get(String(LN.phase === 'check' ? LN.check[LN.ci] : LN.queue[LN.i]).toLowerCase()) : null;
function lnSay() { const e = lnEntry(); if (e && LN.phase === 'cards' && state.settings.speakAloud && tts.ok) { ensureAudio(); say(e.term); } }
function lnCard(knew) {
  const e = lnEntry(); if (!e || LN.phase !== 'cards') return;
  addBankWord(e, knew);
  (knew ? LN.knew : LN.learned).push(e.term);
  if (knew && LN.queue.length < LN.target * 2) {
    const more = nextNew(1, LN.setId, LN.seen)[0];
    if (more) { LN.queue.push(more.term); LN.seen.add(more.term.toLowerCase()); }
  }
  save();
  LN.i++;
  if (LN.i < LN.queue.length) { renderMain(); lnSay(); focusSel('[data-act="n-learn"]'); return; }
  if (LN.learned.length) {
    LN.phase = 'check'; LN.check = shuffle(LN.learned); LN.ci = 0; LN.res = null; LN.given = '';
    renderMain(); scrollTop(); focusSel('#n-inp');
  } else finishLearn();
}
function lnResult(ok, given) {
  const e = lnEntry(); if (!e || LN.res) return;
  const k = e.term.toLowerCase();
  LN.res = ok ? 'ok' : 'no'; LN.given = given;
  if (!(k in LN.first)) {
    LN.first[k] = ok;
    if (!ok) LN.check.push(e.term);   // one more try at the end
  }
  if (ok) beep(988, 0.1);
  renderMain(); focusSel('#n-next');

}
function lnCheck() {
  if (!LN || LN.phase !== 'check' || LN.res) return;
  const el = $('#n-inp'), val = el ? el.value : '';
  if (!val.trim()) { toast('Type the word first, or tap Show me'); return; }
  const e = lnEntry();
  lnResult(isAnswer(val, e.term, e.en), val);
}
function lnNext() {
  if (!LN || LN.phase !== 'check' || !LN.res) return;

}
function finishLearn() {

    addLog({ skill: 'vocab', min: LN.mins, src: 'practice', note: 'New words: ' + LN.learned.length + ' learned' + (LN.knew.length ? ', ' + LN.knew.length + ' already known' : '') });

/* ---------- reviewing: flashcards, or typing the word ---------- */
function startReview() {
  const due = shuffle(dueWords().map(w => w.id));
  if (!due.length) { toast('Nothing due right now'); return; }
  LN = null;
  WV = { queue: due, i: 0, revealed: false, res: null, given: '', known: 0, answers: 0, requeued: new Set(), t0: Date.now(), finished: false };
  ui.tab = 'words';
  render(); scrollTop();
  focusSel('#v-inp');

function answerWord(known) {
  const id = WV.queue[WV.i], w = state.words.find(x => x.id === id);
  if (w) {
    w.reviews = (w.reviews || 0) + 1;
    WV.answers++;
    if (known) {
      const was = w.box;
      w.box = Math.min(5, w.box + 1);
      w.due = addDays(todayISO(), was >= 5 ? 30 : INTERVAL[w.box]);
      WV.known++;
    } else {
      w.box = 1; w.due = todayISO(); w.lapses = (w.lapses || 0) + 1;
      if (!WV.requeued.has(id)) { WV.requeued.add(id); WV.queue.push(id); }
    }
  }
  WV.i++; WV.revealed = false; WV.res = null; WV.given = '';
  if (WV.i >= WV.queue.length) finishReview();
  else { save(); renderMain(); renderTabs(); focusSel('#v-inp'); }
}
function finishReview() {
  if (!WV) return;

function readScoreForm(f) {
