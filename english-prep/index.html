/* ============================================================
   Navigation
   ============================================================ */
function leaveTab() {
  if (ui.tab === 'practice') {
    if (WR.running) wPause();
    if (SP && !['ready', 'done'].includes(SP.phase)) sFinish();
  }
}
function setTab(tab) {
  if (tab === ui.tab) { scrollTop(); return; }
  leaveTab();
  ui.tab = tab;
  if (tab === 'today') ui.showOverdue = false;
  render();
  scrollTop();
}
function go(key) {
  if (!key) return;
  if (key.startsWith('lesson:')) { leaveTab(); openLesson(key.slice(7)); return; }
  if (key.startsWith('w:g-')) { leaveTab(); openWriting('guided', key.slice(2)); return; }
  if (key.startsWith('w:')) { leaveTab(); openWriting(key.slice(2)); return; }
  if (key.startsWith('s:')) { leaveTab(); openSpeaking(key.slice(2)); return; }
  if (key === 'words:review') { leaveTab(); if (dueWords().length) startReview(); else { ui.tab = 'words'; render(); scrollTop(); toast('Nothing due right now'); } return; }
  if (key === 'words:add') { leaveTab(); LN = null; ui.tab = 'words'; ui.addOpen = true; render(); const el = $('#w-term'); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } return; }
  if (key === 'words:learn') { leaveTab(); startLearn(); return; }
  if (key === 'r:cw') { leaveTab(); startCW(); return; }
  if (key.startsWith('scores:')) {
    leaveTab(); ui.tab = 'progress'; ui.scoreForm = key.slice(7); render();
    const f = $('#score-form'); if (f) { f.scrollIntoView({ block: 'start' }); const i = $('input[type=number]', f); if (i) i.focus({ preventScroll: true }); }
    return;
  }
  if (key.startsWith('tab:')) setTab(key.slice(4));
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (!a || a.matches('input[type=checkbox]')) return;
  const act = a.dataset.act, d = a.dataset;
  switch (act) {
    case 'tab': setTab(d.tab); break;
    case 'settings': openSettings(); break;
    case 'goto-day': gotoDay(+d.i); break;
    case 'go': go(d.go); break;
    case 'toggle-overdue': ui.showOverdue = !ui.showOverdue; renderMain(); { const b = $('[data-act="toggle-overdue"]'); if (b) b.focus(); } break;
    case 'pmode': ui.pmode = d.mode; renderMain(); break;
    case 'p-back': backToPractice(); break;
    /* lessons */
    case 'l-open': openLesson(d.id); break;
    case 'l-start': if (LS) startExercises(); break;
    case 'l-learn': if (LS) { LS.step = 'learn'; renderMain(); scrollTop(); } break;
    case 'l-redo': if (LS) { LS.t0 = Date.now(); startExercises(); } break;
    case 'l-opt': if (LS && LS.cur && !LS.cur.answered) { const it = lessonById(LS.id).ex[LS.i], k = +d.k; lessonAnswer(k === it.a, { sel: k }); } break;
    case 'l-check': if (LS) lessonCheck(); break;
    case 'l-place': if (LS && LS.cur && !LS.cur.answered) { LS.cur.placed.push(+d.k); renderMain(); const nb = $('.bank .chunk'); if (nb) nb.focus({ preventScroll: true }); else { const c = $('[data-act="l-check"]'); if (c) c.focus({ preventScroll: true }); } } break;
    case 'l-unplace': if (LS && LS.cur && !LS.cur.answered) { LS.cur.placed = LS.cur.placed.filter(k => k !== +d.k); renderMain(); } break;
    case 'l-clear': if (LS && LS.cur && !LS.cur.answered) { LS.cur.placed = []; renderMain(); } break;
    case 'l-self': if (LS && LS.cur && LS.cur.answered && !LS.cur.ok) { LS.cur.ok = true; LS.cur.self = true; LS.res[LS.i] = true; renderMain(); const nb = $('#l-next'); if (nb) nb.focus({ preventScroll: true }); } break;
    case 'l-next': if (LS) lessonNext(); break;
    /* writing */
    case 'w-open': if (d.task === 'build') startBuild(); else openWriting(d.task); break;
    case 'w-resume': if (state.draft) { ui.pmode = state.draft.task === 'guided' ? 'lessons' : 'writing'; ui.pv = 'write'; render(); scrollTop(); } break;
    case 'w-again': openWriting(d.task); break;
    case 'w-another': {
      const dr = state.draft; if (!dr || dr.started || dr.task === 'guided') break;
      const p = pickFrom(WT[dr.task].list, dr.pid); markUsed(p.id); dr.pid = p.id; save();
      refreshMain(); break;
    }
    case 'w-start': wStart(); { const ta = $('#w-text'); if (ta) ta.focus(); } break;
    case 'w-pause': wPause(); break;
    case 'w-finish': wFinish(); break;
    case 'w-discard': wDiscard(); break;
    case 'w-copy': {
      const e = state.essays.find(x => x.id === d.id); if (!e) break;
      copyText(markingText(e)).then(ok => toast(ok ? 'Copied. Paste it into a chat with Claude.' : 'Copy did not work in this browser'));
      break;
    }
    case 'essay-open': openResult(d.id); break;
    case 'essay-del':
      if (!confirm('Delete this piece of writing?')) break;
      state.essays = state.essays.filter(x => x.id !== d.id); save();
      if (ui.pv === 'result' || ui.pv === 'revise') { ui.pv = 'list'; ui.justSaved = null; }
      renderMain(); toast('Deleted'); break;
    case 'w-revise': ui.pv = 'revise'; ui.reviseId = d.id; renderMain(); scrollTop(); break;
    case 'rev-check': {
      const e = state.essays.find(x => x.id === d.id), ta = $('#rev-text'); if (!e || !ta) break;
      if (!ta.value.trim()) { toast('Write something first'); break; }
      if (!e.rev || e.rev.text !== ta.value || !e.rev.lt) { e.rev = { text: ta.value, date: todayISO(), lt: null }; save(); checkRevision(e.id); }
      else refreshLT('r:' + e.id);
      break;
    }
    case 'rev-done': {
      const e = state.essays.find(x => x.id === d.id), ta = $('#rev-text');
      if (e && ta && ta.value.trim() && (!e.rev || e.rev.text !== ta.value)) { e.rev = { text: ta.value, date: todayISO(), lt: null }; save(); }
      openResult(d.id); break;
    }
    case 'lt-retry': {
      const key = d.key, id = key.slice(2);
      delete LT[key];
      if (key[0] === 'e') checkEssay(id); else checkRevision(id);
      break;
    }
    case 'lt-ok': {
      const key = d.key, e = state.essays.find(x => x.id === key.slice(2)); if (!e) break;
      const src = key[0] === 'r' ? e.rev : e;
      if (!src || !src.lt) { toast('Check your text again first'); break; }
      const m = visibleMatches(src.lt, src.text)[+d.i]; if (!m) break;
      const msg = acceptMatch(m, src.text);
      save(); renderMain(); toast(msg);
      break;
    }
    case 'fb-get': getFeedback(d.id); break;
    case 'key-remove': setApiKey(''); openSettings(); if (ui.pv === 'result') refreshFB(ui.resultId); toast('API key removed'); break;
    case 'dict-del': {
      state.dict = state.dict.filter(w => w !== d.w); save();
      const box = $('#dictlist'); if (box) box.innerHTML = dictHTML();
      if (ui.tab === 'practice' && (ui.pv === 'result' || ui.pv === 'revise')) renderMain();
      toast('"' + d.w + '" removed from your dictionary');
      break;
    }
    case 'ign-clear': {
      state.ltIgnore = []; save();
      const l = $('#ign-line'); if (l) l.textContent = 'Hidden suggestions will show again.';
      if (ui.tab === 'practice' && (ui.pv === 'result' || ui.pv === 'revise')) renderMain();
      break;
    }
    /* complete the words */
    case 'cw-open': leaveTab(); startCW(d.id); break;
    case 'cw-check': cwCheck(); break;
    case 'cw-next': { const i = CTEST.findIndex(x => CW && x.id === CW.id); startCW(CTEST[(i + 1) % CTEST.length].id); break; }
    /* build a sentence */
    case 'b-place': if (BD && !BD.checked) { BD.placed.push(+d.k); refreshMain(); const nb = $('.bank .chunk'); if (nb) nb.focus(); else { const c = $('[data-act="b-check"]'); if (c) c.focus(); } } break;
    case 'b-unplace': if (BD && !BD.checked) { BD.placed = BD.placed.filter(k => k !== +d.k); refreshMain(); } break;
    case 'b-clear': if (BD && !BD.checked) { BD.placed = []; refreshMain(); } break;
    case 'b-check': if (BD && !BD.checked) { buildCheck(); const n = $('[data-act="b-next"]'); if (n) n.focus(); } break;
    case 'b-next': if (BD && BD.checked) { buildNext(); const c = $('.bank .chunk'); if (c) c.focus(); } break;
    /* speaking */
    case 's-open': leaveTab(); openSpeaking(d.task); break;
    case 's-start': sStart(); break;
    case 's-skip':
      if (!SP) break;
      if (SP.phase === 'listen') { hush(); const f = SP.fin; SP.fin = null; if (f) f(); }
      else if (SP.phase === 'prep' || SP.phase === 'read') beginResponse();
      break;
    case 's-next': endResponse(); break;
    case 's-stop': sFinish(); break;
    case 'say': ensureAudio(); say(d.text); break;
    /* words */
    case 'v-start': startReview(); break;
    case 'v-reveal': if (WV) { WV.revealed = true; renderMain(); const y = $('[data-act="v-yes"]'); if (y) y.focus(); } break;
    case 'v-yes': if (WV && WV.revealed) answerWord(true); break;
    case 'v-no': if (WV && WV.revealed) answerWord(false); break;
    case 'v-end': if (WV) { if (WV.answers) finishReview(); else { WV = null; renderMain(); } } break;
    case 'v-dir': ui.wordsDir = state.settings.reviewDir = d.dir; save(); renderMain(); { const b = $('[data-act="v-dir"][data-dir="' + d.dir + '"]'); if (b) b.focus(); } break;
    case 'v-check': if (WV && !WV.res) { const el = $('#v-inp'), val = el ? el.value : ''; if (!val.trim()) { toast('Type the word first, or tap Show me'); break; } reviewTyped(val); } break;
    case 'v-idk': if (WV && !WV.res) reviewTyped(null); break;
    case 'v-self': if (WV && WV.res === 'no') { WV.res = 'ok'; renderMain(); focusSel('#v-next'); } break;
    case 'v-next': if (WV && WV.res) answerWord(WV.res === 'ok'); break;
    /* new words */
    case 'n-start': leaveTab(); startLearn(d.set); break;
    case 'n-learn': lnCard(false); break;
    case 'n-knew': lnCard(true); break;
    case 'n-check': lnCheck(); break;
    case 'n-idk': if (LN && LN.phase === 'check' && !LN.res) lnResult(false, ''); break;
    case 'n-self': if (LN && LN.res === 'no') {
      const e = lnEntry(), k = e.term.toLowerCase();
      LN.res = 'ok';
      if (LN.first[k] === false && LN.check.indexOf(e.term) === LN.ci) { LN.first[k] = true; const j = LN.check.lastIndexOf(e.term); if (j > LN.ci) LN.check.splice(j, 1); }
      renderMain(); focusSel('#n-next');
    } break;
    case 'n-next': lnNext(); break;
    case 'n-more': { const set = LN ? LN.setId : ''; LN = null; startLearn(set); break; }
    case 'n-end':
      if (LN && LN.phase !== 'done' && (LN.learned.length || LN.knew.length)) finishLearn();
      else { LN = null; renderMain(); scrollTop(); }
      break;
    case 'word-del': {
      const w = state.words.find(x => x.id === d.id); if (!w) break;
      if (!confirm('Delete "' + w.term + '"?')) break;
      state.words = state.words.filter(x => x.id !== d.id); save(); renderMain(); renderTabs(); break;
    }
    /* progress */
    case 'score-form': ui.scoreForm = d.exam; renderMain(); { const f = $('#score-form'); if (f) { f.scrollIntoView({ block: 'start' }); const i = $('input[type=number]', f); if (i) i.focus({ preventScroll: true }); } } break;
    case 'score-cancel': ui.scoreForm = null; renderMain(); break;
    case 'score-del':
      if (!confirm('Delete this score?')) break;
      state.scores = state.scores.filter(x => x.id !== d.id); save(); renderMain(); break;
    case 'log-del':
      state.log = state.log.filter(x => x.id !== d.id); save(); renderMain(); renderTop(); toast('Entry deleted'); break;
    /* settings */
    case 'dlg-close': closeDialog(); break;
    case 'export': exportData(); break;
    case 'import': { const f = $('#import-file'); if (f) f.click(); break; }
    case 'reset':
      if (!confirm('Delete all your progress, words, scores and writing in this browser?')) break;
      if (!confirm('Are you sure? This cannot be undone unless you have a backup.')) break;
      if (SP) { sCleanup(true); SP = null; } BD = null; WV = null; LS = null; LN = null; CW = null; WR.running = false;
      state = defaults(); save(); closeDialog(); ui.pv = 'list'; ui.wordsDir = state.settings.reviewDir; render(); toast('Everything reset'); break;
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.matches('[data-act="tick-task"]')) {
    setTask(+el.dataset.d, +el.dataset.t, el.checked);
    save();
    const t = PLAN[+el.dataset.d].tasks[+el.dataset.t];
    if (el.checked && t.m && t.s) toast('Done. Logged ' + t.m + ' min of ' + SKILL[t.s].name.toLowerCase());
    const id = el.id;
    renderTop(); renderMain();
    const again = document.getElementById(id); if (again) again.focus();
  } else if (el.matches('[data-act="tick-habit"]')) {
    setHabit(el.dataset.h, el.checked);
    save();
    const id = el.id;
    renderTop(); renderMain();
    const again = document.getElementById(id); if (again) again.focus();
  } else if (el.id === 'import-file' && el.files && el.files[0]) {
    importData(el.files[0]);
    el.value = '';
  }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'w-text' && state.draft) {
    state.draft.text = el.value;
    if (!WR.running) wStart();
    updateWriteUI();
    saveSoon();
  } else if (el.id === 'rev-text') {
    const e = state.essays.find(x => x.id === ui.reviseId);
    if (e) {
      if (!e.rev || e.rev.text !== el.value) e.rev = { text: el.value, date: todayISO(), lt: null };
      const c = $('#rev-count'); if (c) c.textContent = plural(wordCount(el.value), 'word');
      saveSoon();
    }
  } else if (el.id === 'w-search') {
    ui.wordQuery = el.value;
    $('#wlist').innerHTML = wordListHTML();
  } else if (el.classList && el.classList.contains('cwi') && CW && !CW.checked) {
    CW.vals[+el.dataset.cw] = el.value;
    if (el.value.length >= el.maxLength) { const next = $('.cwi[data-cw="' + (+el.dataset.cw + 1) + '"]'); if (next) next.focus(); }
  } else if (el.closest && el.closest('form[data-form="score"]')) {
    const f = el.closest('form'), { out } = readScoreForm(f), o = overallOf(f.dataset.exam, out);
    $('#score-overall').textContent = o == null ? '– (needs all four sections)' : o.toFixed(1);
  }
});

document.addEventListener('submit', ev => {
  const f = ev.target, kind = f.dataset.form;
  if (!kind) return;
  ev.preventDefault();
  if (kind === 'quicklog') {
    const min = Math.round(Number(f.elements.min.value));
    const date = f.elements.date.value;
    if (!(min > 0) || !isISO(date)) { toast('Add the minutes and a date'); return; }
    if (date > todayISO()) { toast('That date is in the future'); return; }
    const skill = (f.querySelector('input[name=skill]:checked') || {}).value || 'listening';
    addLog({ skill, min: Math.min(min, 600), date, note: f.elements.note.value.trim(), src: 'manual' });
    save(); renderTop(); renderMain();
    toast('Logged ' + min + ' min of ' + SKILL[skill].name.toLowerCase());
  }
  if (kind === 'word') {
    const term = f.elements.term.value.trim();
    if (!term) return;
    if (state.words.some(w => w.term.toLowerCase() === term.toLowerCase())) { toast('"' + term + '" is already in your list'); return; }
    state.words.unshift({ id: uid(), term, meaning: f.elements.meaning.value.trim(), example: f.elements.example.value.trim(), box: 1, due: todayISO(), added: todayISO(), reviews: 0, lapses: 0 });
    if (state.words.length >= 10) autoTick('words:add', true);
    ui.addOpen = true;
    save(); renderTop(); renderTabs(); renderMain();
    const t = $('#w-term'); if (t) t.focus();
    toast('Added "' + term + '"');
  }
  if (kind === 'score') {
    const { out, bad } = readScoreForm(f);
    const E = EXAMS[out.exam];
    if (bad) { toast(E.name + ' scores go from ' + E.min + ' to ' + E.max); return; }
    if (E.order.every(k => out[k] == null)) { toast('Add at least one section score'); return; }
    const date = f.elements.date.value;
    if (!isISO(date)) { toast('Add a date'); return; }
    const entry = Object.assign({ id: uid(), date, ts: Date.now(), source: f.elements.source.value.trim() }, out);
    entry.overall = overallOf(out.exam, entry);
    state.scores.push(entry);
    autoTick('scores:' + out.exam, false);
    ui.scoreForm = null;
    save(); renderTop(); renderMain();
    toast(E.name + ' score saved');
  }
  if (kind === 'settings') {
    const s = state.settings, el = f.elements;
    if (!isISO(el.start.value)) { toast('Pick a start date'); return; }
    s.start = el.start.value;
    s.toeflDate = isISO(el.toeflDate.value) ? el.toeflDate.value : '';
    s.ieltsDate = isISO(el.ieltsDate.value) ? el.ieltsDate.value : '';
    s.toeflTarget = Number(el.toeflTarget.value);
    s.ieltsTarget = Number(el.ieltsTarget.value);
    s.dailyGoal = clamp(Math.round(Number(el.dailyGoal.value) || 90), 10, 600);
    s.speakAloud = el.speakAloud.checked;
    s.spelling = el.spelling.value === 'en-US' ? 'en-US' : 'en-GB';
    s.model = MODELS[el.model.value] ? el.model.value : DEFAULT_MODEL;
    s.name = el.name.value.trim().slice(0, 30);
    s.newWords = NEW_WORD_OPTIONS.includes(Number(el.newWords.value)) ? Number(el.newWords.value) : 10;
    s.bg = el.bg.value === 'plain' ? 'plain' : 'sky';
    const k = el.apiKey.value.trim();
    if (k) setApiKey(k);
    save(); closeDialog(); render(); toast(k ? 'Settings and API key saved' : 'Settings saved');
  }
});

document.addEventListener('toggle', ev => {
  const d = ev.target;
  if (d && d.matches && d.matches('details.part')) {
    const p = +d.dataset.part;
    if (d.open) ui.openParts.add(p); else ui.openParts.delete(p);
  }
  if (d && d.matches && d.matches('details.addword')) ui.addOpen = d.open;
}, true);

document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t && t.matches && t.matches('[data-l-input]') && ev.key === 'Enter' && !ev.shiftKey) {
    ev.preventDefault();
    if (LS && LS.cur && !LS.cur.answered) lessonCheck();
    else { const nb = $('#l-next'); if (nb) nb.click(); }
    return;
  }
  if (t && t.id === 'n-inp' && ev.key === 'Enter') { ev.preventDefault(); lnCheck(); return; }
  if (t && t.id === 'v-inp' && ev.key === 'Enter') { ev.preventDefault(); const b = $('[data-act="v-check"]'); if (b) b.click(); return; }
  if (t && t.classList && t.classList.contains('cwi')) {
    const k = +t.dataset.cw;
    if (ev.key === 'Enter') { ev.preventDefault(); cwCheck(); }
    else if (ev.key === 'Backspace' && !t.value && k > 0) { ev.preventDefault(); const p = $('.cwi[data-cw="' + (k - 1) + '"]'); if (p) { p.focus(); p.setSelectionRange(p.value.length, p.value.length); } }
    return;
  }
  if (ui.tab !== 'words' || !WV || WV.finished) return;
  if (t.closest && t.closest('input, textarea, select')) return;
  if ($('#dlg').open) return;
  if (typeMode(curWord())) return;
  if ((ev.key === ' ' || ev.key === 'Enter') && !WV.revealed) {
    if (t.closest && t.closest('button, a, summary')) return;
    ev.preventDefault(); WV.revealed = true; renderMain(); const y = $('[data-act="v-yes"]'); if (y) y.focus();
  } else if (WV.revealed && ev.key === '1') { ev.preventDefault(); answerWord(false); }
  else if (WV.revealed && ev.key === '2') { ev.preventDefault(); answerWord(true); }
});

$('#dlg').addEventListener('click', ev => { if (ev.target === ev.currentTarget) closeDialog(); });

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (ui.tab === 'progress') drawProgressCharts();
    if (ui.tab === 'practice') drawStim();
  }, 150);
});
function flush() { if (WR.running) { wFold(); dirty = true; } if (dirty) save(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);
window.addEventListener('beforeunload', ev => {
  flush();
  if (SP && SP.recs.length && SP.phase !== 'ready' && SP.phase !== 'done') { ev.preventDefault(); ev.returnValue = ''; }
});
/* another tab saved: take its data, but keep an essay that is being written here */
window.addEventListener('storage', ev => {
  if (ev.key !== KEY) return;
  const writingHere = ui.tab === 'practice' && ui.pv === 'write' && state.draft ? state.draft : null;
  state = load();
  if (writingHere) { state.draft = writingHere; saveSoon(); }
  if (ui.pv === 'write' && !state.draft) ui.pv = 'list';
  if (ui.tab === 'practice' && ui.pv !== 'list') { renderTop(); renderTabs(); }
  else render();
});

/* one clock for every timer on the page */
setInterval(() => {
  const t = todayISO();
  if (t !== lastDay) { lastDay = t; if (ui.tab !== 'practice' || ui.pv === 'list') render(); else renderTop(); }
  if (ui.tab === 'practice') {
    if (ui.pv === 'write' && state.draft) {
      if (WR.running && Date.now() - WR.lastFold > 5000) { wFold(); WR.lastFold = Date.now(); saveSoon(); }
      updateWriteUI();
    } else if (ui.pv === 'speak' && SP) updateSpeakUI();
    else if (ui.pv === 'build' && BD) updateBuildTimer();
    else if (ui.pv === 'cw' && CW) updateCWTimer();
  }
}, 250);

render();
})();
</script>
</body>
</html>
