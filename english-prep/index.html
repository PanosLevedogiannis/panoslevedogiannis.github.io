<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<title>Private page</title>
<!-- Locked page. DATA is the gzipped page, encrypted with AES-256-GCM (ciphertext followed by the 16-byte tag).
     The page key is in KEYS once per user, each encrypted with PBKDF2-HMAC-SHA256 of username + newline + password
     (SALT, ITER iterations, 32 bytes). -->
<style>
:root{--bg:#F6F3EE;--card:#FFFFFF;--ink:#1B2333;--muted:#5B677D;--line:#DCE1E9;--accent:#2142C8;--accent-ink:#FFFFFF;--red:#C02B36;
  --glow1:rgba(255,168,120,.30);--glow2:rgba(130,140,255,.24);--soft:#E8EDFC;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0E1422;--card:#161E31;--ink:#E8ECF4;--muted:#9AA5BA;--line:#2A3550;--accent:#8AA2FF;--accent-ink:#0E1422;--red:#FF8A8A;
  --glow1:rgba(110,120,255,.20);--glow2:rgba(214,90,160,.12);--soft:#1E2944;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(40rem 28rem at 0% 0%,var(--glow1),transparent 70%),radial-gradient(36rem 26rem at 100% 0%,var(--glow2),transparent 70%),var(--bg)}
.card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px 22px;box-shadow:0 10px 30px rgba(20,28,45,.08)}
.icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;line-height:1.2;margin:16px 0 4px}
.lead{margin:0 0 18px;color:var(--muted)}
label.fld{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
input[type=password],input[type=text]{display:block;width:100%;min-height:48px;padding:11px 14px;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input[type=password]:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.row{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:15px;cursor:pointer}
.row input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
button{display:block;width:100%;min-height:48px;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.65;cursor:progress}
.err{min-height:22px;margin:12px 0 0;color:var(--red);font-weight:700;font-size:14px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" id="gate" hidden>
  <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg></div>
  <h1>Private page</h1>
  <p class="lead">Enter your username and password to open it.</p>
  <form id="f" novalidate>
    <label class="fld" for="user">Username</label>
    <input id="user" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required style="margin-bottom:14px">
    <label class="fld" for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <label class="row"><input type="checkbox" id="remember" checked> Remember this device</label>
    <button id="go" type="submit">Unlock</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
